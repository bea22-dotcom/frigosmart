<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frigo Smart</title>
    <link rel="stylesheet" href="style.css">
    <!-- Libreria di scansione universale compatibile con iOS/Safari -->
    <script type="text/javascript" src="https://unpkg.com"></script>
</head>
<body>

    <div class="container">
        <h1>🍏 Il Mio Frigo Smart</h1>

        <!-- SEZIONE SCANNER ZXING PER SAFARI -->
        <div class="scanner-section">
            <h2>📷 Scanner Codici a Barre</h2>
            <div class="btn-group">
                <button class="action-btn" onclick="avviaScanner()">🔋 Accendi Fotocamera</button>
                <button class="action-btn" onclick="cambiaTelecamera()">🔄 Gira Fotocamera</button>
            </div>
            
            <div id="reader" style="width: 100%; max-width: 400px; min-height: 200px; margin: 15px auto; background-color: #000; border-radius: 8px; overflow: hidden;">
                <!-- Tag video con i vincoli obbligatori di Apple -->
                <video id="video-stream" autoplay playsinline muted style="width: 100%; height: auto; background: #000;"></video>
            </div>
            
            <p id="scan-result" style="font-weight: bold; margin-top: 10px; color: #333;">In attesa della telecamera...</p>
        </div>

        <!-- AGGIUNTA MANUALE -->
        <div class="manual-section">
            <h2>✍️ Aggiungi Prodotto Manualmente</h2>
            <div class="input-group">
                <input type="text" id="manual-input" placeholder="Es. Latte, Uova, Mela...">
                <button class="add-btn" onclick="aggiungiManuale()">Aggiungi</button>
            </div>
        </div>

        <!-- LISTE PRODOTTI -->
        <div class="lists-container">
            <div class="list-box">
                <h2>❄️ Nel Frigorifero</h2>
                <ul id="frigo-list"></ul>
            </div>

            <div class="list-box">
                <h2>🛒 Lista della Spesa</h2>
                <ul id="spesa-list"></ul>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
