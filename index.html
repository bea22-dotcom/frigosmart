<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frigo Smart</title>
    <link rel="stylesheet" href="style.css">
    <!-- Libreria Universale Professionale per Codici a Barre (Zxing) -->
    <script type="text/javascript" src="https://unpkg.com"></script>
</head>
<body>

    <div class="container">
        <h1>🍏 Il Mio Frigo Smart</h1>

        <!-- SEZIONE SCANNER ZXING -->
        <div class="scanner-section">
            <h2>📷 Scanner Codici a Barre</h2>
            <div class="btn-group">
                <button class="action-btn" onclick="avviaScanner()">🔋 Accendi Fotocamera</button>
                <button class="action-btn" onclick="cambiaTelecamera()">🔄 Gira Fotocamera</button>
            </div>
            
            <!-- Contenitore video per Zxing -->
            <div id="reader" style="width: 100%; max-width: 400px; min-height: 200px; margin: 15px auto; background-color: #f0f0f0; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                <video id="video" style="width: 100%; height: auto; border-radius: 8px;"></video>
            </div>
            
            <p id="scan-result" style="font-weight: bold; margin-top: 10px; color: #333;">In attesa della telecamera...</p>
        </div>

        <!-- AGGIUNTA MANUALE -->
        <div class="manual-section">
            <h2>✍️ Aggiungi Prodotto Manualmente</h2>
            <div class="input-group">
                <input type="text" id="manual-input" placeholder="Es. Latte, Uova, Mela...">
                <button class="add-btn" onclick="aggiungiManuale()">Aggiungi</button>
            </div>
        </div>

        <!-- LISTE PRODOTTI -->
        <div class="lists-container">
            <div class="list-box">
                <h2>❄️ Nel Frigorifero</h2>
                <ul id="frigo-list"></ul>
            </div>

            <div class="list-box">
                <h2>🛒 Lista della Spesa</h2>
                <ul id="spesa-list"></ul>
            </div>
        </div>
    </div>

   <script src="https://cloudflare.com"></script>
</body>
</html>
