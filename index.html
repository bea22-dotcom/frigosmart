<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home Hub - Frigo & Guardaroba</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <style>
        :root {
            --primary-frigo: #10b981;
            --primary-frigo-dark: #059669;
            --primary-wardrobe: #6366f1;
            --primary-wardrobe-dark: #4f46e5;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-radius: 16px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 2rem; color: #111827; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        /* TABS */
        .tab-navigation {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: #e5e7eb;
            padding: 5px;
            border-radius: 12px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn.active[data-tab="frigo"] {
            background: var(--primary-frigo);
            color: white;
        }

        .tab-btn.active[data-tab="wardrobe"] {
            background: var(--primary-wardrobe);
            color: white;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .grid-layout { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 768px) { 
            .grid-layout { grid-template-columns: 1fr 1fr; } 
            .full-width { grid-column: span 2; } 
        }

        .card { background: var(--card-bg); border-radius: var(--border-radius); padding: 20px; box-shadow: var(--shadow); }
        .card-header { font-size: 1.1rem; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; color: #111827; }

        #reader { width: 100%; min-height: 280px; background: #000; border-radius: 12px; overflow: hidden; }
        
        .controls-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }

        .btn { background-color: var(--primary-frigo); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .btn-wardrobe { background-color: var(--primary-wardrobe); }
        .btn-wardrobe:hover { background-color: var(--primary-wardrobe-dark); }
        .btn-danger { background-color: #ef4444; }

        .status-badge { font-size: 0.85rem; padding: 8px 12px; border-radius: 8px; background-color: #e0e7ff; color: #3730a3; margin-top: 10px; display: block; word-break: break-word; }
        
        .product-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .product-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; }
        
        .tag-badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; background: #e5e7eb; color: #374151; font-weight: 500; margin-left: 5px; }

        .icon-btn { background: none; border: none; cursor: pointer; font-size: 1rem; color: #6b7280; padding: 4px; }
        .icon-btn:hover { color: #ef4444; }
        .icon-btn.check:hover { color: var(--primary-frigo); }
        .select-field, .input-field { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.95rem; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🏠 Smart Home Hub</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Gestore unificato Frigo & Guardaroba</p>
        </header>

        <!-- SELEZIONE SEZIONE -->
        <div class="tab-navigation">
            <button class="tab-btn active" data-tab="frigo" onclick="switchTab('frigo')">
                <i class="fa-solid fa-snowflake"></i> Frigorifero
            </button>
            <button class="tab-btn" data-tab="wardrobe" onclick="switchTab('wardrobe')">
                <i class="fa-solid fa-shirt"></i> Guardaroba
            </button>
        </div>

        <!-- SCANNER UNIFICATO -->
        <div class="card full-width" style="margin-bottom: 20px;">
            <div class="card-header" id="scanner-title">
                <i class="fa-solid fa-barcode"></i> Scanner Ottimizzato (Fotocamera Posteriore)
            </div>
            
            <div id="reader"></div>

            <div class="controls-group">
                <button class="btn" id="start-btn" onclick="startScanner()">
                    <i class="fa-solid fa-camera"></i> Avvia Fotocamera Posteriore
                </button>
                <button class="btn btn-danger" id="stop-btn" onclick="stopScanner()" style="display: none;">
                    <i class="fa-solid fa-stop"></i> Ferma Fotocamera
                </button>
            </div>
            <div id="status-msg" class="status-badge" style="display: none;"></div>
        </div>

        <!-- SCHEDA FRIGORIFERO -->
        <div id="frigo-tab" class="tab-content active">
            <div class="grid-layout">
                <div class="card full-width">
                    <div class="card-header"><i class="fa-solid fa-pen" style="color: var(--primary-frigo)"></i> Aggiungi Prodotto Cibo</div>
                    <form id="add-frigo-form" style="display: flex; flex-direction: column; gap: 10px;" onsubmit="handleManualFrigoAdd(event)">
                        <input type="text" id="prod-name" class="input-field" placeholder="Nome alimento (es. Latte, Pasta)" required>
                        <div style="display: flex; gap: 10px;">
                            <input type="date" id="prod-date" class="input-field">
                            <select id="prod-target" class="select-field">
                                <option value="frigo">Nel Frigo</option>
                                <option value="spesa">Lista Spesa</option>
                            </select>
                        </div>
                        <button type="submit" class="btn"><i class="fa-solid fa-plus"></i> Aggiungi Alimento</button>
                    </form>
                </div>

                <div class="card">
                    <div class="card-header"><i class="fa-solid fa-snowflake" style="color: var(--primary-frigo)"></i> Nel Frigorifero</div>
                    <ul class="product-list" id="frigo-list"></ul>
                </div>

                <div class="card">
                    <div class="card-header"><i class="fa-solid fa-cart-shopping" style="color: var(--primary-frigo)"></i> Lista della Spesa</div>
                    <ul class="product-list" id="spesa-list"></ul>
                </div>
            </div>
        </div>

        <!-- SCHEDA GUARDAROBA -->
        <div id="wardrobe-tab" class="tab-content">
            <div class="grid-layout">
                <div class="card full-width">
                    <div class="card-header"><i class="fa-solid fa-pen" style="color: var(--primary-wardrobe)"></i> Aggiungi Capo d'Abbigliamento</div>
                    <form id="add-wardrobe-form" style="display: flex; flex-direction: column; gap: 10px;" onsubmit="handleManualWardrobeAdd(event)">
                        <input type="text" id="cloth-name" class="input-field" placeholder="Nome capo (es. Felpa Nera Nike)" required>
                        <div style="display: flex; gap: 10px;">
                            <select id="cloth-category" class="select-field">
                                <option value="Maglie & T-Shirt">👕 Maglie & T-Shirt</option>
                                <option value="Pantaloni">👖 Pantaloni</option>
                                <option value="Giacche & Cappotti">🧥 Giacche & Cappotti</option>
                                <option value="Scarpe">👟 Scarpe</option>
                                <option value="Accessori">🧢 Accessori</option>
                            </select>
                            <select id="cloth-status" class="select-field">
                                <option value="armadio">👔 Nell'Armadio</option>
                                <option value="lavare">🧺 Da Lavare</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-wardrobe"><i class="fa-solid fa-plus"></i> Aggiungi al Guardaroba</button>
                    </form>
                </div>

                <div class="card">
                    <div class="card-header"><i class="fa-solid fa-shirt" style="color: var(--primary-wardrobe)"></i> Nell'Armadio</div>
                    <ul class="product-list" id="wardrobe-list"></ul>
                </div>

                <div class="card">
                    <div class="card-header"><i class="fa-solid fa-jug-detergent" style="color: var(--primary-wardrobe)"></i> Da Lavare / In Lavanderia</div>
                    <ul class="product-list" id="laundry-list"></ul>
                </div>
            </div>
        </div>

    </div>

    <script>
        let currentTab = 'frigo';
        let html5QrCode = null;

        let frigoItems = JSON.parse(localStorage.getItem('frigoItems')) || [];
        let spesaItems = JSON.parse(localStorage.getItem('spesaItems')) || [];
        let wardrobeItems = JSON.parse(localStorage.getItem('wardrobeItems')) || [];
        let laundryItems = JSON.parse(localStorage.getItem('laundryItems')) || [];

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
            document.getElementById(`${tab}-tab`).classList.add('active');

            const startBtn = document.getElementById('start-btn');
            if (tab === 'wardrobe') {
                startBtn.className = "btn btn-wardrobe";
            } else {
                startBtn.className = "btn";
            }
        }

        function renderLists() {
            const frigoUl = document.getElementById('frigo-list');
            const spesaUl = document.getElementById('spesa-list');

            frigoUl.innerHTML = frigoItems.length === 0 ? '<p style="color: #9ca3af; font-size: 0.85rem;">Frigo vuoto</p>' : '';
            spesaUl.innerHTML = spesaItems.length === 0 ? '<p style="color: #9ca3af; font-size: 0.85rem;">Lista spesa vuota</p>' : '';

            frigoItems.forEach((item, index) => {
                frigoUl.innerHTML += `
                    <li class="product-item">
                        <div>
                            <strong>${item.name}</strong>
                            ${item.date ? `<br><small style="color:#6b7280">Scadenza: ${item.date}</small>` : ''}
                        </div>
                        <button class="icon-btn" onclick="deleteItem('frigo', ${index})"><i class="fa-solid fa-trash"></i></button>
                    </li>`;
            });

            spesaItems.forEach((item, index) => {
                spesaUl.innerHTML += `
                    <li class="product-item">
                        <div><strong>${item.name}</strong></div>
                        <div>
                            <button class="icon-btn check" onclick="moveToFrigo(${index})"><i class="fa-solid fa-check"></i></button>
                            <button class="icon-btn" onclick="deleteItem('spesa', ${index})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </li>`;
            });

            const wardrobeUl = document.getElementById('wardrobe-list');
            const laundryUl = document.getElementById('laundry-list');

            wardrobeUl.innerHTML = wardrobeItems.length === 0 ? '<p style="color: #9ca3af; font-size: 0.85rem;">Armadio vuoto</p>' : '';
            laundryUl.innerHTML = laundryItems.length === 0 ? '<p style="color: #9ca3af; font-size: 0.85rem;">Nessun capo da lavare</p>' : '';

            wardrobeItems.forEach((item, index) => {
                wardrobeUl.innerHTML += `
                    <li class="product-item">
                        <div>
                            <strong>${item.name}</strong>
                            <span class="tag-badge">${item.category}</span>
                        </div>
                        <div>
                            <button class="icon-btn" title="Metti da lavare" onclick="moveToLaundry(${index})"><i class="fa-solid fa-soap"></i></button>
                            <button class="icon-btn" onclick="deleteItem('wardrobe', ${index})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </li>`;
            });

            laundryItems.forEach((item, index) => {
                laundryUl.innerHTML += `
                    <li class="product-item">
                        <div>
                            <strong>${item.name}</strong>
                            <span class="tag-badge">${item.category}</span>
                        </div>
                        <div>
                            <button class="icon-btn check" title="Rimetti in armadio" onclick="moveToWardrobe(${index})"><i class="fa-solid fa-check"></i></button>
                            <button class="icon-btn" onclick="deleteItem('laundry', ${index})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </li>`;
            });

            localStorage.setItem('frigoItems', JSON.stringify(frigoItems));
            localStorage.setItem('spesaItems', JSON.stringify(spesaItems));
            localStorage.setItem('wardrobeItems', JSON.stringify(wardrobeItems));
            localStorage.setItem('laundryItems', JSON.stringify(laundryItems));
        }

        function handleManualFrigoAdd(e) {
            e.preventDefault();
            const name = document.getElementById('prod-name').value;
            const date = document.getElementById('prod-date').value;
            const target = document.getElementById('prod-target').value;

            if (target === 'frigo') frigoItems.push({ name, date });
            else spesaItems.push({ name });

            renderLists();
            document.getElementById('add-frigo-form').reset();
        }

        function handleManualWardrobeAdd(e) {
            e.preventDefault();
            const name = document.getElementById('cloth-name').value;
            const category = document.getElementById('cloth-category').value;
            const status = document.getElementById('cloth-status').value;

            if (status === 'armadio') wardrobeItems.push({ name, category });
            else laundryItems.push({ name, category });

            renderLists();
            document.getElementById('add-wardrobe-form').reset();
        }

        function deleteItem(type, index) {
            if (type === 'frigo') frigoItems.splice(index, 1);
            else if (type === 'spesa') spesaItems.splice(index, 1);
            else if (type === 'wardrobe') wardrobeItems.splice(index, 1);
            else if (type === 'laundry') laundryItems.splice(index, 1);
            renderLists();
        }

        function moveToFrigo(index) {
            const item = spesaItems.splice(index, 1)[0];
            frigoItems.push({ name: item.name, date: '' });
            renderLists();
        }

        function moveToLaundry(index) {
            const item = wardrobeItems.splice(index, 1)[0];
            laundryItems.push(item);
            renderLists();
        }

        function moveToWardrobe(index) {
            const item = laundryItems.splice(index, 1)[0];
            wardrobeItems.push(item);
            renderLists();
        }

        // LOGICA SCANNER CON FOCUS E FOTOCAMERA POSTERIORE FORZATA
        async function startScanner() {
            showStatus("Attivazione fotocamera posteriore ed auto-focus...");
            
            try {
                if (!html5QrCode) {
                    html5QrCode = new Html5Qrcode("reader");
                }

                // Configurazione per forzare la fotocamera posteriore e l'alta risoluzione
                const cameraConfig = { 
                    facingMode: { exact: "environment" } 
                };

                const config = {
                    fps: 15,
                    qrbox: { width: 280, height: 180 }, // Box di lettura bilanciato
                    videoConstraints: {
                        facingMode: "environment",
                        width: { min: 1280, ideal: 1920 },
                        height: { min: 720, ideal: 1080 },
                        advanced: [{ focusMode: "continuous" }] // Messa a fuoco continua hardware
                    },
                    formatsToSupport: [
                        Html5QrcodeSupportedFormats.EAN_13,
                        Html5QrcodeSupportedFormats.EAN_8,
                        Html5QrcodeSupportedFormats.UPC_A,
                        Html5QrcodeSupportedFormats.UPC_E,
                        Html5QrcodeSupportedFormats.CODE_128,
                        Html5QrcodeSupportedFormats.QR_CODE
                    ]
                };

                // Avvio con fallback in caso il dispositivo non supporti { exact: "environment" }
                try {
                    await html5QrCode.start(cameraConfig, config, onScanSuccess);
                } catch(e) {
                    // Fallback a facingMode standard se exact fallisce
                    await html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);
                }

                document.getElementById('start-btn').style.display = 'none';
                document.getElementById('stop-btn').style.display = 'flex';
                showStatus(`Scanner attivo per ${currentTab === 'frigo' ? 'Frigo' : 'Guardaroba'}. Metti a fuoco il codice.`);

            } catch (err) {
                console.error(err);
                showStatus("Errore nell'accesso alla fotocamera posteriore. Verifica i permessi nel browser.");
            }
        }

        async function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                await html5QrCode.stop();
                document.getElementById('start-btn').style.display = 'flex';
                document.getElementById('stop-btn').style.display = 'none';
                showStatus("Scanner fermato.");
            }
        }

        async function onScanSuccess(decodedText) {
            showStatus(`Codice scansionato: ${decodedText}. Ricerca info in corso...`);

            if (currentTab === 'frigo') {
                try {
                    const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${decodedText}.json`);
                    const data = await res.json();

                    if (data.status === 1 && data.product && data.product.product_name) {
                        const prodName = data.product.product_name;
                        frigoItems.push({ name: prodName, date: '' });
                        showStatus(`Aggiunto al Frigo: ${prodName}`);
                    } else {
                        frigoItems.push({ name: `Prodotto (${decodedText})`, date: '' });
                        showStatus(`Aggiunto al Frigo: Prodotto (${decodedText})`);
                    }
                } catch (e) {
                    frigoItems.push({ name: `Prodotto (${decodedText})`, date: '' });
                    showStatus(`Aggiunto al Frigo: Codice (${decodedText})`);
                }
            } else {
                wardrobeItems.push({ name: `Capo/Etichetta (${decodedText})`, category: 'Abbigliamento' });
                showStatus(`Aggiunto all'Armadio: Capo (${decodedText})`);
            }

            renderLists();
        }

        function showStatus(msg) {
            const el = document.getElementById('status-msg');
            el.innerText = msg;
            el.style.display = 'block';
        }

        renderLists();
    </script>
</body>
</html>
